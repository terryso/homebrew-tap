name: Update Cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to update (e.g., v0.27.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get version without v prefix
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"  # 移除 v 前缀
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update Cask
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # 更新 Casks/proxycast.rb 中的版本号
          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/proxycast.rb

          # 显示更新后的文件
          cat Casks/proxycast.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/proxycast.rb
          git diff --staged --quiet || git commit -m "Update proxycast to v${{ steps.version.outputs.version }}"
          git push
